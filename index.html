<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Q2 Drill 1</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
    	
    	body{
    		background-image: url("picklebg.png");
    	}

 		.header{
			background-color: #d3f576;
			align-content: center;
			display: flex;
			flex-direction: column;
			margin-left: auto;
			margin-right: auto;
			justify-content: center;
			align-items: center;
			padding: 5px;
			margin-top: 120px;
			width: 100%;
			border-radius: 15px;
			max-width: 800px;
		}

		.pickleimg{
			width: 200px;
			height: 200px;
			align-content: center;
			justify-content: center;
			align-self: center;
			margin-top: 46px;
			margin-bottom: 46px;
			border-radius: 300px;
			border: 3px solid #d3f576;
		}

		.pickleball{
			align-content: center;
			display: flex;
			flex-direction: column;
			margin-left: auto;
			margin-right: auto;
			justify-content: center;
			align-items: center;
			padding: 5px;
		}

       .square {
       	    margin-top: 160px;
            width: 500px;
            height: 200px;
            background-color: white;
            color: black;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            text-align: left;
            align-items: left; 
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 20px black;
            border: 2px solid #d3f576;

        }

		.container{
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100px;
			gap: 20px;

		}

		.square h3 {
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 12px; 
            text-align: left;
            border-bottom: 1px solid black; 
            padding-bottom: 6px

        }

        .square ul {
            margin: 0;
            padding-left: 18px;
            text-align: left;
        }

        .square li {
            font-size: 13px;
            margin-bottom: 6px;
            line-height: 1.3;
        }

    </style>

</head>
<body>

	<div class="header">
			<h2>Beginner's Guide to Pickleball</h2>
	</div>

<br>

<div class="pickleball">
<img class="pickleimg" src="pickleicon.png">
</div>

<br>

	<div class="container">
		<div class="square">

		<h3>Basic Rules</h3>
		<ul>
			<li>Serve diagonally</li>
			<li>Double bounce rule</li>
			<li>No volley zone</li>
			<li>Scoring</li>
		</ul>

	    </div>
		  <div class="square">

		  <h3>Equipment</h3>
		<ul>
			<li>Paddle</li>
			<li>A pickleball ball</li>
			<li>Net</li>
			<li>Court</li>
		</ul>

		</div>
		  <div class="square">

		  <h3>Basic Moves</h3>
		<ul>
			<li>Service</li>
			<li>Groundstroke</li>
			<li>Volley</li>
			<li>Dinking</li>
		</ul>

		</div>
	    </div>
	</div>

</body>
</html>
